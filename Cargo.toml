[package]
name = "dprint-plugin-typescript"
version = "0.99.1"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-typescript"
keywords = ["formatting", "formatter", "typescript", "javascript"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-typescript"
description = "TypeScript and JavaScript code formatter."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[[test]]
name = "corpus"
path = "tests/corpus_test.rs"
harness = false

[dependencies]
capacity_builder = "0.5.0"
dprint-core = { version = "0.75.2", features = ["formatting"] }
dprint-core-macros = "0.1.0"
globset = "0.4"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_diagnostics = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_syntax = "0.158.0"
percent-encoding = "2.3.1"
rustc-hash = "2.1.1"
self_cell = "1.2.0"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
dprint-development = "0.12.1"
dprint-plugin-sql = "0.2.0"
malva = "0.11.2"
markup_fmt = "0.19.0"
pretty_assertions = "1.3.0"
serde_json = { version = "1.0" }
